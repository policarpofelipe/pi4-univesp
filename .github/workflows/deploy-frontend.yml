name: Deploy frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Publicar frontend na VPS
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Configurar SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "${VPS_SSH_KEY}" ]; then
            echo "Secret VPS_SSH_KEY ausente ou vazio."
            exit 1
          fi
          if [ -z "${VPS_KNOWN_HOSTS}" ]; then
            echo "Secret VPS_KNOWN_HOSTS ausente ou vazio."
            exit 1
          fi
          umask 077
          mkdir -p "${HOME}/.ssh"
          chmod 700 "${HOME}/.ssh"
          python3 - <<'PY'
          import os
          from pathlib import Path

          ssh = Path.home() / ".ssh"
          key = os.environ["VPS_SSH_KEY"].replace("\r\n", "\n")
          hosts = os.environ["VPS_KNOWN_HOSTS"].replace("\r\n", "\n")
          if not key.endswith("\n"):
              key += "\n"
          if not hosts.endswith("\n"):
              hosts += "\n"
          (ssh / "deploy_key").write_text(key, encoding="utf-8")
          (ssh / "known_hosts").write_text(hosts, encoding="utf-8")
          PY
          chmod 600 "${HOME}/.ssh/deploy_key"
          chmod 644 "${HOME}/.ssh/known_hosts"

      - name: Atualizar, validar e publicar na VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${VPS_HOST}" ]; then
            echo "Secret VPS_HOST ausente ou vazio."
            missing=1
          fi
          if [ -z "${VPS_USER}" ]; then
            echo "Secret VPS_USER ausente ou vazio."
            missing=1
          fi
          if [ -z "${VPS_PORT}" ]; then
            echo "Secret VPS_PORT ausente ou vazio."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "Crie Repository secrets (Settings → Secrets and variables → Actions), não Environment secrets, a menos que o job declare environment."
            exit 1
          fi
          ssh -i "${HOME}/.ssh/deploy_key" \
            -p "${VPS_PORT}" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            "${VPS_USER}@${VPS_HOST}" \
            'bash -s' << 'REMOTE'
          set -euo pipefail

          export NVM_DIR="$HOME/.nvm"
          if [ ! -s "$NVM_DIR/nvm.sh" ]; then
            echo "NVM não encontrado em ${HOME}/.nvm."
            exit 1
          fi
          . "$NVM_DIR/nvm.sh"
          nvm use 24

          NODE_MAJOR="$(node -p "process.versions.node.split('.')[0]")"
          if [ "$NODE_MAJOR" != "24" ]; then
            echo "Node 24 obrigatório; encontrado $(node -v)"
            exit 1
          fi

          cd /home/flivocom/pi4-univesp

          if [ -n "$(git status --porcelain)" ]; then
            echo "Árvore local suja; recusando deploy para não destruir alterações."
            git status --porcelain
            exit 1
          fi

          git fetch origin
          git checkout main
          git pull --ff-only origin main

          if [ "$(git rev-parse --abbrev-ref HEAD)" != "main" ]; then
            echo "Branch atual não é main."
            exit 1
          fi

          cd /home/flivocom/pi4-univesp/frontend
          npm ci
          npm run check

          if [ ! -f dist/index.html ]; then
            echo "Build não gerou dist/index.html; nada será publicado."
            exit 1
          fi

          rsync -a --delete \
            --exclude='.well-known/' \
            dist/ \
            /home/flivocom/pi4.flivo.com.br/

          curl -fsS https://pi4.flivo.com.br/ > /dev/null
          curl -fsS https://pi4.flivo.com.br/api/status
          REMOTE
