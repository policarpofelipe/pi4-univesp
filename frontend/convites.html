<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PI4 UNIVESP — Convites</title>
  </head>
  <body class="shell">
    <a class="skip-link" href="#conteudo">Ir para o conteúdo</a>
    <header class="shell-top">
      <p class="shell-marca">PI4 UNIVESP</p>
      <nav class="shell-nav" aria-label="Principal">
        <a href="/painel.html">Painel</a>
        <a href="/convites.html" aria-current="page">Convites</a>
      </nav>
      <div class="shell-user">
        <span id="nome-usuario">…</span>
        <span id="perfil-usuario" class="perfil">…</span>
        <a class="botao botao-secundario" href="/painel.html">Voltar</a>
      </div>
    </header>
    <main id="conteudo" class="shell-main">
      <h1>Convites</h1>
      <p class="lede">
        Convide pessoas pelo nome e e-mail. Elas definem a própria senha. Não há
        cadastro público.
      </p>
      <form id="form-convite" class="form-restrito" hidden>
        <div class="campo">
          <label for="nome">Nome</label>
          <input
            id="nome"
            name="nome"
            type="text"
            autocomplete="name"
            required
          />
        </div>
        <div class="campo">
          <label for="email">E-mail</label>
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            required
          />
        </div>
        <button type="submit" class="botao">Enviar convite</button>
      </form>
      <p id="aviso-convites" class="aviso" hidden aria-live="polite"></p>
      <h2>Convites recentes</h2>
      <div id="lista-convites"></div>
    </main>
    <script type="module" src="/src/paginas/convites.js"></script>
  </body>
</html>
