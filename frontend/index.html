<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PI4 UNIVESP — Status do ambiente</title>
  </head>
  <body>
    <a class="skip-link" href="#conteudo">Ir para o conteúdo</a>

    <header class="app-header">
      <p>Projeto Integrador 4 — UNIVESP</p>
      <h1>Análise de Dados do Suporte Técnico</h1>
    </header>

    <main id="conteudo" class="app-main">
      <section aria-labelledby="titulo-status">
        <h2 id="titulo-status">Status do ambiente</h2>
        <p class="intro">
          Verificação da API FastAPI e da conexão com o MariaDB. Esta tela ainda
          não é o dashboard analítico.
        </p>

        <dl>
          <div class="status-list">
            <div class="status-item" id="item-backend" data-estado="carregando">
              <dt id="rotulo-backend">Backend</dt>
              <dd
                id="backend"
                aria-live="polite"
                aria-labelledby="rotulo-backend"
              >
                Carregando — verificando backend…
              </dd>
            </div>
            <div class="status-item" id="item-banco" data-estado="carregando">
              <dt id="rotulo-banco">Banco de dados</dt>
              <dd id="banco" aria-live="polite" aria-labelledby="rotulo-banco">
                Carregando — verificando banco…
              </dd>
            </div>
          </div>
        </dl>

        <button type="button" class="botao" id="atualizar-status">
          Atualizar status
        </button>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
